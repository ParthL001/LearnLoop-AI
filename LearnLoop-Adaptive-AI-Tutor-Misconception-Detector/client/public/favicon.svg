<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" width="100%" height="100%">
  <defs>
    <!-- AI/Tech Gradient for the Loop -->
    <linearGradient id="loopGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" /> <!-- Indigo -->
      <stop offset="50%" stop-color="#3B82F6" /> <!-- Blue -->
      <stop offset="100%" stop-color="#06B6D4" /> <!-- Cyan -->
    </linearGradient>
  </defs>

  <!-- Logo Icon: Continuous Adaptive Loop -->
  <g transform="translate(5, 0)">
    <!-- The Infinity/Loop Path -->
    <path 
      d="M 55,105 C 10,105 10,45 55,45 C 85,45 100,65 115,75 C 130,85 145,105 175,105 C 220,105 220,45 175,45 C 145,45 130,65 115,75 C 100,85 85,105 55,105 Z" 
      fill="none" 
      stroke="url(#loopGradient)" 
      stroke-width="18" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    
    <!-- "Intervention Nodes" representing the AI diagnosing and verifying -->
    <circle cx="175" cy="45" r="9" fill="#F59E0B" /> <!-- Amber/Gold -->
    <circle cx="55" cy="105" r="9" fill="#F59E0B" />
  </g>
</svg>